# Render Blueprint — see https://render.com/docs/blueprint-spec
#
# IMPORTANT: the backend MUST be deployed with `env: docker` (not Render's
# native Python runtime). moviepy needs the ffmpeg binary, which is only
# guaranteed to be present via server/Dockerfile's `apt-get install ffmpeg`
# step. If you create this service manually in the Render dashboard instead
# of using this blueprint, make sure to pick "Docker" as the environment,
# not "Python 3".
services:
  - type: web
    name: museforge-api
    env: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    envVars:
      - key: MUAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MUSEFORGE_DEMO
        value: ""
      # Placeholder clip demo mode serves instead of a generated video. Leave
      # empty to use the built-in default; set it here the moment that fixture
      # stops resolving, because a dead URL makes demo jobs complete with a
      # video that will not play — with no error anywhere to show for it.
      - key: MUSEFORGE_DEMO_VIDEO
        value: ""
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CREATOR
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://your-project.vercel.app"
      - key: MUSEFORGE_JOBS_DIR
        value: /tmp/museforge_jobs
      # INFO is what makes a delivered job explainable after the fact: the
      # second budget it was costed at, which stage declined lip sync, how
      # many scenes got foley. Nothing configured logging before, so those
      # lines went to logging.lastResort and were dropped at WARNING. Set
      # WARNING here for the old quiet, DEBUG only while chasing something.
      - key: MUSEFORGE_LOG_LEVEL
        value: "INFO"
      # Long Pro jobs (up to 24 sequential scenes) need generous timeouts.
      # Generation runs as a FastAPI BackgroundTask after /api/generate returns,
      # so Render's ~100 min HTTP request timeout does not apply to the job
      # itself — these bounds are in-process guards instead.
      - key: MUSEFORGE_PIPELINE_HARD_TIMEOUT
        value: "7200"
      - key: MUSEFORGE_STALE_JOB_TIMEOUT_MINUTES
        value: "150"
      - key: MUSEFORGE_SECONDS_PER_SCENE
        value: "100"
      # Spoken character dialogue (ElevenLabs text-to-dialogue via MuAPI).
      # Off by default — every line is a paid call — but it must be declared
      # here: /api/health reports `dialogue_available` from this flag, and the
      # client only offers the Pro dialogue toggle when that is true. Left out
      # of the blueprint entirely, a deployment ships with the feature sold on
      # the pricing page and unreachable in the product. Set to "1" to enable.
      - key: MUSEFORGE_DIALOGUE_ENABLED
        value: ""
      # Lip sync. Requires dialogue to be on — with no generated voice there
      # is nothing to sync a mouth to — and the key its provider needs:
      # MUAPI_KEY on the default MuAPI backend, FAL_KEY only when
      # MUSEFORGE_LIPSYNC_PROVIDER=falai (see tools/muapi_lipsync).
      #
      # ON in the blueprint. This is a deployment-READINESS flag, not a
      # spending one: the per-job opt-in still sits behind the Pro toggle and
      # still charges +1 credit per speaking scene, so nothing here spends
      # money on its own. Shipped empty, it read as "off" everywhere that
      # matters — /api/health reported lipsync_available=false, the toggle
      # never rendered, and a request that asked for lip sync anyway was
      # dropped in generate(). Delivered dramas came back with the voice laid
      # over closed, motionless mouths and no way for the user to fix it.
      - key: MUSEFORGE_LIPSYNC_ENABLED
        value: "1"
      - key: FAL_KEY
        sync: false
      # Film-look finishing (free — folded into the existing finishing encode).
      # Empty = built-in defaults: 24fps cadence + subtle grain, no matte.
      # MUSEFORGE_TARGET_FPS=0 keeps the provider's own frame rate.
      - key: MUSEFORGE_TARGET_FPS
        value: ""
      - key: MUSEFORGE_FILM_GRAIN
        value: ""
      # 2.39:1 matte. Leave OFF unless this deployment delivers 16:9 only —
      # the bars are burned into the master, so the 9:16 / 1:1 re-export would
      # centre-crop a frame that already has them.
      - key: MUSEFORGE_LETTERBOX
        value: ""
      # Per-boundary dissolves (interfaces/transitions decides which joins
      # earn one). Master switch: compositing costs memory, cuts do not.
      - key: MUSEFORGE_SCENE_TRANSITIONS
        value: ""

      # ── Voice provider ───────────────────────────────────────────────────
      # Both declared as `sync: false` rather than with a value, because this
      # blueprint must not be able to CLEAR them: a value here overwrites
      # whatever the dashboard holds on the next sync, and one of them is a key.
      #
      # Going direct to ElevenLabs is not only about price. It is the only path
      # that returns per-line timings and per-CHARACTER alignment, and the
      # kinetic caption style below is built on that alignment -- so with the
      # MuAPI voice wrapper, MUSEFORGE_WORD_CAPTIONS silently does nothing.
      - key: MUSEFORGE_VOICE_PROVIDER
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false

      # ── Acting, pacing and sound design ──────────────────────────────────
      # Everything below is OFF when empty, which is the shipped default. The
      # keys are declared anyway so an operator can find them in the dashboard
      # instead of in the source -- same reasoning as MUSEFORGE_DIALOGUE_ENABLED
      # above.

      # Acted end frames: the shot's start frame is edited into the emotional
      # peak and handed to the video model as `last_image`, so the performance
      # is interpolated rather than described. Costs one image per shot
      # (~$0.03) and needs an EDIT model, never an identity model -- see
      # MUSEFORGE_EDIT_MODEL. Fail-open: any error animates from one frame.
      - key: MUSEFORGE_ACTING_END_FRAME
        value: ""
      - key: MUSEFORGE_EDIT_MODEL
        value: ""

      # A second angle on the scenes that earn it (tension 8+): a two-second
      # cutaway on the listening face. ~$0.34 a scene, which takes a Pro-plan
      # scene from ~78% margin to ~69% -- above the floor the pricing tests
      # enforce, but a business decision rather than a default.
      - key: MUSEFORGE_REACTION_SHOTS
        value: ""
      # The cutaway's model. Empty uses veo3.1-lite ($0.30 FLAT, takes an end
      # frame). Do not point this at Kling: $0.72 for two seconds of a face is
      # not a second angle, it is a second scene.
      - key: MUAPI_VIDEO_MODEL_REACTION
        value: ""

      # Internal cutting: rhythm cut out of one generation's own pixels, at no
      # provider cost and without changing the scene's length. Empty = auto,
      # which follows the director style's pacing.
      - key: MUSEFORGE_INTERNAL_CUTS
        value: ""

      # Impact on the cut frame: one-frame flash, decaying shake, chromatic
      # aberration. Empty = auto (only where a real cut exists, at tension 10).
      - key: MUSEFORGE_IMPACT
        value: ""

      # Foley: a generated sound bed per scene, prompted from the storyboard's
      # own audio note. $0.01 a scene -- the cheapest thing this product can
      # buy, and the layer that most separates a drama from a slideshow.
      #
      # ON. Left off, a job with music disabled ships a master that is mostly
      # DIGITAL SILENCE -- measured on a delivered drama: 12 audible seconds
      # in 60, the rest absolute zero -- and the speech in it reads as pasted
      # over the picture because there is no place underneath it. A cent a
      # scene against a credit that sells for dollars; set to "" to revert.
      - key: MUSEFORGE_FOLEY
        value: "1"
      - key: MUAPI_SFX_MODEL
        value: ""

      # Kinetic (word-by-word) captions. Requires the ElevenLabs voice path
      # above for measured word timings; falls back to plain captions without
      # it rather than guessing, because a highlight on the wrong word reads as
      # a broken player.
      # Speaker names in subtitles. Off: broadcast names a speaker only when
      # the picture cannot. SDH deployments want the opposite.
      - key: MUSEFORGE_SPEAKER_LABELS
        value: ""

      - key: MUSEFORGE_WORD_CAPTIONS
        value: ""

      # Narrative shape. "micro_drama" opens on the shock, refuses to resolve,
      # and puts a cold-open teaser in front of the film. Also selectable per
      # job via the API's `narrative_mode`, which outranks this.
      - key: MUSEFORGE_NARRATIVE_MODE
        value: ""
      - key: MUSEFORGE_COLD_OPEN
        value: ""
